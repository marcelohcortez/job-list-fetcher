services:
  app:
    build: .
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_PATH=/data/jobs.db
      - JOBTECH_QUERIES=${JOBTECH_QUERIES:-}
      - GREENHOUSE_BOARDS=${GREENHOUSE_BOARDS:-}
      - LEVER_BOARDS=${LEVER_BOARDS:-}
      - CINODE_ACCESS_ID=${CINODE_ACCESS_ID:-}
      - CINODE_ACCESS_SECRET=${CINODE_ACCESS_SECRET:-}
      - CINODE_COMPANY_ID=${CINODE_COMPANY_ID:-}
      - THEIRSTACK_API_KEY=${THEIRSTACK_API_KEY:-}
      # Ollama runs natively on the host (not in Docker) for GPU/Metal
      # acceleration - see README "Local semantic matching". This reaches
      # the host from inside the container on Docker Desktop (Mac/Windows);
      # on Linux, replace with the host's LAN/bridge IP.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:--1}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - app_data:/data
    depends_on:
      - chroma

  chroma:
    image: chromadb/chroma
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/data

volumes:
  app_data:
  chroma_data:
