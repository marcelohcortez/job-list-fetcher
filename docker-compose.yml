services:
  app:
    build: .
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_PATH=/data/jobs.db
      - JOBTECH_QUERIES=${JOBTECH_QUERIES:-}
      - GREENHOUSE_BOARDS=${GREENHOUSE_BOARDS:-}
      - LEVER_BOARDS=${LEVER_BOARDS:-}
      - CINODE_ACCESS_ID=${CINODE_ACCESS_ID:-}
      - CINODE_ACCESS_SECRET=${CINODE_ACCESS_SECRET:-}
      - CINODE_COMPANY_ID=${CINODE_COMPANY_ID:-}
      - THEIRSTACK_API_KEY=${THEIRSTACK_API_KEY:-}
    volumes:
      - app_data:/data

volumes:
  app_data:
