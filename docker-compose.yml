services:
  app:
    build: .
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_PATH=/data/jobs.db
      - JOBTECH_QUERIES=${JOBTECH_QUERIES:-}
      - GREENHOUSE_BOARDS=${GREENHOUSE_BOARDS:-}
      - LEVER_BOARDS=${LEVER_BOARDS:-}
      - CINODE_ACCESS_ID=${CINODE_ACCESS_ID:-}
      - CINODE_ACCESS_SECRET=${CINODE_ACCESS_SECRET:-}
      - CINODE_COMPANY_ID=${CINODE_COMPANY_ID:-}
      - THEIRSTACK_API_KEY=${THEIRSTACK_API_KEY:-}
      # Ollama runs natively on the host (not in Docker) for GPU/Metal
      # acceleration - see README "Local semantic matching". This reaches
      # the host from inside the container on Docker Desktop (Mac/Windows);
      # on Linux, replace with the host's LAN/bridge IP.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:--1}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # Laya (Docs/laya-integration-plan.md) runs as the `laya` service
      # below, reached over the compose network by service name. Override
      # LAYA_API_URL in .env to point elsewhere, or blank it to disable.
      - LAYA_API_URL=${LAYA_API_URL:-http://laya:8000}
      - LAYA_API_KEY=${LAYA_API_KEY:-}
      - LAYA_TOP_K=${LAYA_TOP_K:-10}
      - LAYA_WEIGHT=${LAYA_WEIGHT:-0.3}
    volumes:
      - app_data:/data
    depends_on:
      - chroma
      - laya

  chroma:
    image: chromadb/chroma
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/data

  laya:
    build:
      context: ./docker
      dockerfile: laya.Dockerfile
    ports:
      - '8002:8000'
    environment:
      # LAYA_PRELOAD=1 fails on container start here: Docker's embedded DNS
      # (127.0.0.11) isn't ready in the instant right after container start,
      # and the eager model download races it and crashes the container.
      # Leaving preload off means the first real evaluation request pays the
      # one-time download cost instead (by then DNS is warm) - set to 1 only
      # if this is fixed upstream or you add a startup delay.
      - LAYA_PRELOAD=0
      # - LAYA_API_KEY=${LAYA_API_KEY:-}   # uncomment to require bearer auth
    volumes:
      - laya_models:/root/.cache/huggingface

volumes:
  app_data:
  chroma_data:
  laya_models:
